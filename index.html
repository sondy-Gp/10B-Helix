<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для самой лучшей тёти 👑</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #ffd1e8, #e0c3ff 55%, #c3d9ff);
    color: #3b1d4a;
    overflow: hidden;
  }
  #app {
    height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  #progress { height: 6px; background: rgba(255,255,255,.5); }
  #bar { height: 100%; width: 0; background: #d63384; transition: width .4s; }
  #screen {
    flex: 1; overflow-y: auto; padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center;
    animation: fade .45s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card {
    background: rgba(255,255,255,.8); border-radius: 24px;
    padding: 24px 20px; box-shadow: 0 10px 30px rgba(120,60,160,.2);
  }
  h2 { margin: 0 0 14px; font-size: 21px; line-height: 1.3; }
  p { font-size: 17px; line-height: 1.55; margin: 0 0 14px; white-space: pre-line; }
  .tag { font-size: 13px; letter-spacing: 1px; color: #a0449a; font-weight: 700; margin-bottom: 8px; }
  .btn {
    display: block; width: 100%; border: 0; cursor: pointer;
    padding: 16px; margin-top: 12px; border-radius: 16px;
    font-size: 17px; font-weight: 600; font-family: inherit; text-align: left;
    background: #fff; color: #3b1d4a; box-shadow: 0 3px 10px rgba(120,60,160,.18);
    transition: transform .1s, background .2s;
  }
  .btn:active { transform: scale(.97); background: #ffe3f1; }
  .next {
    text-align: center; color: #fff; background: linear-gradient(135deg, #d63384, #8e44ad);
    margin-top: 20px;
  }
  .next:active { background: linear-gradient(135deg, #b82a70, #732f8f); }
  /* Загрузка */
  #loader {
    position: fixed; inset: 0; z-index: 10;
    background: linear-gradient(160deg, #ffd1e8, #e0c3ff 55%, #c3d9ff);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .6s;
  }
  #loader .emoji { font-size: 96px; animation: bounce .8s infinite alternate ease-in-out; }
  @keyframes bounce { from { transform: translateY(0) rotate(-12deg); } to { transform: translateY(-30px) rotate(12deg); } }
  #loader .txt { margin-top: 20px; font-size: 18px; font-weight: 600; }
  .big { font-size: 64px; text-align: center; margin-bottom: 10px; }
  .center { text-align: center; }
</style>
</head>
<body>

<div id="loader">
  <div class="emoji">😝</div>
  <div class="txt">Загрузка<span id="dots"></span></div>
</div>

<div id="app">
  <div id="progress"><div id="bar"></div></div>
  <div id="screen"></div>
</div>

<script>
const texts = [
  {
    title: "👑 Добро пожаловать!",
    body: "Добро пожаловать на сайт самой удивительной женщины в истории человечества.\n\nОфициально этот ресурс посвящен моей тёте. Неофициально — мастер-классу по тому, как успевать всё на свете, выглядеть потрясающе и держать в страхе и восхищении всю семью.\n\nВнимание: если вы опоздали на эту страницу даже на две секунды, тётя уже заметила это по вашей ауре. Пунктуальность — её суперсила, красота — её стандарт, а терпение к нам со всеми нашими вопросами — настоящее святое дело."
  },
  {
    title: "✨ Для вселенной",
    body: "Этот сайт создан исключительно для того, чтобы у вселенной не осталось сомнений в том, кто тут главная звезда.\n\nДля самой красивой, самой пунктуальной (часы сверяют по её вздоху) и самой любимой тёти на свете.\n\nПредупреждение: за орфографические ошибки в коде отвечает племянник, за идеальный порядок в тексте мысленно следит она сама, а за ваше прекрасное настроение отвечает этот сайт. Приятного просмотра!"
  }
];

const questions = [
  { q: "Что вы сделаете, если тётя назначит встречу на 15:00?",
    a: ["Приеду в 14:45, чтобы не испытывать судьбу.",
        "Приеду ровно в 15:00. (Внимание: всё равно опоздали, она уже ждёт там с 14:50).",
        "Буду молиться, чтобы время вообще остановилось."] },
  { q: "Каков ваш уровень подготовки перед тем, как заговорить с ней?",
    a: ["Базовый (почистил зубы, собрался с мыслями).",
        "Средний (выучил наизусть расписание всех её побед и заслуг).",
        "Экстремальный (мысленно написал завещание на случай, если покритикуют прическу)."] },
  { q: "Как второй закон термодинамики (о росте энтропии и хаоса) объясняет чистоту и порядок в её доме?",
    a: ["Никак. Этот закон бессилен перед её силой воли, и энтропия во вселенной растёт вопреки, а у неё дома — идеальный порядок за счёт локального нарушения законов физики.",
        "Хаос боится её строгого взгляда и самоуничтожается ещё на подступах к коврику в прихожей.",
        "Она использует тёмную материю исключительно для поддержания порядка на кухне."] },
  { q: "Кто твой любимый племянник?",
    a: ["Арби", "Арби", "Арби", "Арби"] },
  { q: "Кто главный гений современности после тёти?",
    a: ["Эйнштейн (отдыхает в сторонке)",
        "Племянник Арби (старается не отставать)",
        "Никого больше нет, лимит исчерпан"] },
  { q: "Кто написал этот потрясающий сайт?",
    a: ["Гениальный племянник Арби.",
        "Тот самый единственный любимый племянник Арби.",
        "Ну конечно же Арби, кто же ещё!"] },
  { q: "Чьё слово в доме закон?",
    a: ["Нурьян", "Макка (Наида)", "Нурсет"] },
  { q: "Главный вопрос сайта: кому достанется титул «Главная гордость и золотой племянник века»?",
    a: ["Арби", "Арби", "Арби"] }
];

const finalText = "Сайт создан с любовью, трепетом и под моими ментальными проблемами. Спасибо за внимание, закрывайте вкладку правильно — а то мой перфекционизм пострадает!\n\nАссаламу Алейком.";

const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const total = texts.length + questions.length + 1;
let step = 0;

function render(html) {
  screen.style.animation = "none";
  void screen.offsetWidth;
  screen.style.animation = "";
  screen.innerHTML = html;
  screen.scrollTop = 0;
  bar.style.width = (step / (total - 1) * 100) + "%";
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function show() {
  if (step < texts.length) {
    const t = texts[step];
    render(`<div class="card">
      <h2>${t.title}</h2>
      <p>${esc(t.body)}</p>
      <button class="btn next" onclick="go()">Далее ➜</button>
    </div>`);
  } else if (step < texts.length + questions.length) {
    const i = step - texts.length;
    const item = questions[i];
    const letters = ["А", "Б", "В", "Г"];
    const answers = item.a.map((a, k) =>
      `<button class="btn" onclick="go()"><b>${letters[k]})</b> ${esc(a)}</button>`).join("");
    render(`<div class="card">
      <div class="tag">ВОПРОС ${i + 1} ИЗ ${questions.length}</div>
      <h2>${esc(item.q)}</h2>
      ${answers}
    </div>`);
  } else {
    render(`<div class="card center">
      <div class="big">💖👑💖</div>
      <p>${esc(finalText)}</p>
    </div>`);
    launchHearts();
  }
}

function go() { step++; show(); }

function launchHearts() {
  const icons = ["💖", "👑", "✨", "🌸", "😝"];
  for (let i = 0; i < 25; i++) {
    const s = document.createElement("span");
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.cssText = `position:fixed;bottom:-40px;left:${Math.random() * 100}vw;font-size:${20 + Math.random() * 24}px;
      transition:transform ${4 + Math.random() * 4}s linear, opacity ${4 + Math.random() * 4}s linear;pointer-events:none;z-index:5;`;
    document.body.appendChild(s);
    setTimeout(() => {
      s.style.transform = `translateY(-${window.innerHeight + 80}px)`;
      s.style.opacity = "0";
    }, 50 + Math.random() * 3000);
    setTimeout(() => s.remove(), 10000);
  }
}

// Загрузочный экран
let d = 0;
const dots = document.getElementById("dots");
const dotTimer = setInterval(() => { d = (d + 1) % 4; dots.textContent = ".".repeat(d); }, 400);

window.addEventListener("load", () => {
  setTimeout(() => {
    clearInterval(dotTimer);
    const l = document.getElementById("loader");
    l.style.opacity = "0";
    setTimeout(() => l.remove(), 600);
    show();
  }, 2200);
});
</script>
</body>
</html>
